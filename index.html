<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Audioguide</title>
  
  <meta name="theme-color" content="#1e293b">
  <meta name="description" content="Audioguide PWA interactif et hors-ligne pour la visite de monuments historiques">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%232563eb'/%3E%3Cpath d='M256 120a136 136 0 0 0-136 136v72a48 48 0 0 0 48 48h16a16 16 0 0 0 16-16v-80a16 16 0 0 0-16-16h-44v-8a116 116 0 1 1 232 0v8h-44a16 16 0 0 0-16 16v80a16 16 0 0 0 16 16h16a48 48 0 0 0 48-48v-72a136 136 0 0 0-136-136z' fill='white'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='100' fill='%232563eb'/%3E%3Cpath d='M256 120a136 136 0 0 0-136 136v72a48 48 0 0 0 48 48h16a16 16 0 0 0 16-16v-80a16 16 0 0 0-16-16h-44v-8a116 116 0 1 1 232 0v8h-44a16 16 0 0 0-16 16v80a16 16 0 0 0 16 16h16a48 48 0 0 0 48-48v-72a136 136 0 0 0-136-136z' fill='white'/%3E%3C/svg%3E">

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div id="app-container">

    <!-- ====================================================================
         VIEW 1: HOME
         ==================================================================== -->
    <main id="view-home" class="view-section active">
      <header class="home-hero" id="home-hero-bg">
        <div class="home-hero-content">
          <span class="monument-badge" id="monument-badge"></span>
          <h1 class="monument-title" id="monument-title">Audioguide</h1>
          <p class="monument-subtitle" id="monument-subtitle"></p>
        </div>
      </header>

      <section class="home-body">
        <div class="language-selector-section">
          <label class="section-label" id="label-select-language"></label>
          <div class="languages-grid" id="languages-grid">
            <!-- Dynamically populated from config.yml -->
          </div>
        </div>

        <div class="home-info-box">
          <span style="font-size: 20px;">🎧</span>
          <div>
            <strong id="home-headphones-tip"></strong>
            <p id="home-offline-tip" style="margin-top: 2px;"></p>
          </div>
        </div>

        <button id="btn-start-tours" class="home-cta-btn">
          <span id="txt-start-tours"></span>
          <span>→</span>
        </button>
      </section>
    </main>

    <!-- ====================================================================
         VIEW 2: TOUR SELECTION
         ==================================================================== -->
    <main id="view-tours" class="view-section">
      <header class="view-header">
        <button id="btn-tours-back" class="nav-back-btn">
          <!-- Chevron icon injected -->
        </button>
        <h2 class="view-header-title" id="tours-header-title"></h2>
      </header>

      <section class="tours-list-container" id="tours-list">
        <!-- Dynamically populated from content/<lang>/config.yml -->
      </section>
    </main>

    <!-- ====================================================================
         VIEW 3: STEP VIEW
         ==================================================================== -->
    <main id="view-step" class="view-section">
      <header class="step-top-bar">
        <button id="btn-step-back-tours" class="nav-back-btn">
          <!-- Chevron icon injected -->
        </button>
        <select id="step-selector-select" class="step-selector-select">
          <!-- Dynamically populated with step titles -->
        </select>
      </header>

      <article class="step-content-area">
        <span class="step-indicator-badge" id="step-indicator-badge"></span>
        <h2 class="step-heading" id="step-heading"></h2>
        <div class="step-body-markdown" id="step-body-markdown">
          <!-- Rendered markdown text with carousels -->
        </div>
      </article>
    </main>

    <!-- ====================================================================
         STICKY BOTTOM AUDIO PLAYER
         ==================================================================== -->
    <footer id="audio-player-bar" style="display: none;">
      <!-- Progress row -->
      <div class="player-progress-container">
        <span class="player-time" id="player-time-current">00:00</span>
        <input type="range" id="player-seekbar" class="player-seekbar" min="0" max="100" value="0" step="0.1">
        <span class="player-time" id="player-time-duration">00:00</span>
      </div>

      <!-- Controls row -->
      <div class="player-controls-row">
        <button id="player-btn-prev-step" class="player-step-btn">
          <span id="player-icon-prev"></span>
          <span id="player-txt-prev"></span>
        </button>

        <div class="player-center-controls">
          <button id="player-btn-skip-back" class="player-skip-btn">
            <!-- -10s icon -->
          </button>

          <button id="player-btn-play" class="player-play-btn">
            <!-- Play / Pause icon -->
          </button>

          <button id="player-btn-skip-forward" class="player-skip-btn">
            <!-- +10s icon -->
          </button>
        </div>

        <button id="player-btn-next-step" class="player-step-btn">
          <span id="player-txt-next"></span>
          <span id="player-icon-next"></span>
        </button>
      </div>
    </footer>

    <!-- Discreet Settings Gear Button (Home View) -->
    <button id="btn-settings-open" class="home-settings-btn" aria-label="Paramètres">
      <!-- Injected via getIcon('settings') -->
    </button>

    <!-- Tour Action Overlay & Bottom Sheet -->
    <div id="tour-action-overlay" class="tour-action-overlay" aria-hidden="true"></div>
    <div id="tour-action-sheet" class="tour-action-sheet" role="dialog" aria-modal="true" aria-labelledby="tour-sheet-title" aria-hidden="true">
      <div class="tour-sheet-handle"></div>
      <div class="tour-sheet-header">
        <div class="tour-sheet-header-main">
          <span id="tour-sheet-badge" class="tour-card-badge"></span>
          <h3 id="tour-sheet-title" class="tour-sheet-title"></h3>
        </div>
        <button id="btn-tour-sheet-close" class="sheet-close-btn" aria-label="Fermer">✕</button>
      </div>
      <div class="tour-sheet-content">
        <div class="tour-sheet-meta" id="tour-sheet-meta"></div>
        <p class="tour-sheet-desc" id="tour-sheet-desc"></p>

        <div class="tour-sheet-actions">
          <button id="btn-tour-download" class="btn-tour-download">
            <span id="tour-download-status"></span>
          </button>
          <div class="tour-download-bar" id="tour-download-bar" style="display: none;">
            <div class="tour-download-fill" id="tour-download-fill"></div>
          </div>
          <button id="btn-tour-start" class="btn-tour-start">
            <span id="txt-tour-start"></span>
          </button>
        </div>
      </div>
    </div>

    <!-- Settings Overlay & Bottom Sheet -->
    <div id="settings-overlay" class="settings-overlay" aria-hidden="true"></div>
    <div id="settings-sheet" class="settings-sheet" role="dialog" aria-modal="true" aria-labelledby="settings-title" aria-hidden="true">
      <div class="settings-sheet-handle"></div>
      <div class="settings-sheet-header">
        <h3 id="settings-title" class="settings-sheet-title"></h3>
        <button id="btn-settings-close" class="settings-close-btn" aria-label="Fermer">✕</button>
      </div>
      <div class="settings-sheet-content">
        <div class="settings-option-row">
          <div class="settings-option-text">
            <label for="toggle-dev-mode" id="lbl-dev-mode" class="settings-option-label"></label>
            <p id="desc-dev-mode" class="settings-option-desc"></p>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-dev-mode" class="toggle-checkbox">
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="settings-option-row">
          <div class="settings-option-text">
            <label for="toggle-autoplay" id="lbl-autoplay" class="settings-option-label"></label>
            <p id="desc-autoplay" class="settings-option-desc"></p>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="toggle-autoplay" class="toggle-checkbox" checked>
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="settings-action-row">
          <button id="btn-clear-cache" class="settings-clear-cache-btn">
            <span id="txt-clear-cache"></span>
          </button>
        </div>
      </div>
    </div>

  </div>

  <!-- Vendors -->
  <script src="js/vendor/marked.min.js"></script>
  <script src="js/vendor/js-yaml.min.js"></script>

  <!-- Application Bootstrap -->
  <script type="module">
    import { AudioguideApp } from './js/app.js';
    let storedDev = false;
    try {
      storedDev = typeof localStorage !== 'undefined' && localStorage.getItem('audioguide_dev_mode') === 'true';
    } catch (_) {}
    const isDev = (typeof window !== 'undefined' && typeof window.location !== 'undefined'
      && new URLSearchParams(window.location.search).get('dev') === '1')
      || storedDev;
    const configPath = typeof window !== 'undefined' && typeof window.location !== 'undefined'
      ? new URLSearchParams(window.location.search).get('config') || 'config.yml'
      : 'config.yml';

    window.audioguideApp = new AudioguideApp({ isDevMode: isDev, rootConfigPath: configPath });
    window.audioguideApp.init();

    // Service Worker management: disabled in dev mode (?dev=1), enabled otherwise
    if ('serviceWorker' in navigator) {
      if (isDev) {
        console.info('🛠️ Mode dev actif (?dev=1) : Service Worker désactivé et caches purgés.');
        navigator.serviceWorker.getRegistrations().then(regs => {
          for (const reg of regs) {
            reg.unregister();
          }
        });
        if ('caches' in window) {
          caches.keys().then(keys => {
            for (const key of keys) {
              caches.delete(key);
            }
          });
        }
      } else {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./service-worker.js', { type: 'module' })
            .then(reg => console.log('PWA Service Worker registered:', reg.scope))
            .catch(err => console.warn('Service Worker registration failed:', err));
        });
      }
    }
  </script>
</body>
</html>
